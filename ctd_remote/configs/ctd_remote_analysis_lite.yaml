input_dir: /mnt/data/gapfill_outputs_ctd_remote_lite/analysis_ready_segments
output_dir: /mnt/data/analysis_outputs_ctd_remote_lite
segment_glob: segment_*_analysis_ready.csv
time_col: timestamp
required_core_vars:
- pressure
- temperature
- conductivity
optional_core_vars:
- salinity
- level
psd:
  fs_hz: 0.0011111111111111111
  max_nperseg: 256
fi:
  window_hours: 72
  step_hours: 12
  samples_per_hour: 4
  epsilon: 1.0e-12
  multivariate_bins: 5
  min_coverage: 0.8
graph:
  corr_threshold: 0.3
abrupt:
  k_mad: 3
regimes:
  k: 3
  features:
  - FI
  - mean_connectivity
  - link_density
pca_groups:
  Core variables:
  - pressure
  - temperature
  - conductivity
  All remote CTD variables:
  - pressure
  - temperature
  - conductivity
  - salinity
  - level
