analysis_mode: tolerance_landscape_elkhorn
input_csv: data/elkhorn/south_marsh.csv
reference_csv: data/elkhorn/south_marsh_reference.csv
output_dir: output/tolerance_landscape_elkhorn

time_col: timestamp
state_col: do_mgl
condition_cols:
  - temp
  - sal
  - depth

# Common discretization across all windows is required for comparability.
binning:
  state_bins: 6
  condition_bins: 2

# 15-min data: lag_steps=4 corresponds to a 1-hour transition.
transition:
  lag_steps: 4
  min_row_count: 20
  pseudocount: 0.0

# Primary analysis uses observed values only. If gap-filled data are analyzed,
# run them as a separate sensitivity analysis rather than silently mixing them.
observed_only:
  flag_cols: []
  accepted_flags:
    - observed

windows:
  window_days: 60
  step_days: 7

viability:
  oxygen_threshold_mg_l: 3.0
  # With one-hour transitions, 24 steps = 24 h.
  horizon_steps: 24
  sensitivity_thresholds_mg_l: [2.0, 3.0, 4.0, 5.0]
  sensitivity_horizons_steps: [6, 12, 24, 48]

complexity_bridge:
  # Optional A-Frank-Analysis early-warning file.
  tmsi_csv: null
  merge_tolerance: 3D
